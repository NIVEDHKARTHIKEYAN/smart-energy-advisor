<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Energy Advisor</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
<script src="password-toggle.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <form id="loginForm" class="auth-card">
            <h1>⚡ Welcome Back</h1>
            <p>Login to your Smart Energy Advisor account.</p>

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <div class="password-wrapper">
    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
    >
    <button
        type="button"
        class="toggle-password"
        data-target="password"
        aria-label="Show password"
        aria-pressed="false"
    >Show</button>
</div>

            <button type="submit">Login</button>
            <p id="loginMessage" role="status" aria-live="polite"></p>

            <p>Don't have an account?
                <a href="register.html">Register here</a>
            </p>

            <a href="index.html">Back to Dashboard</a>
        </form>
    </main>
</body>
</html>
